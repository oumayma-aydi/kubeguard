apiVersion: v1
kind: Pod
metadata:
  name: secure
  namespace: kubeguard-demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
  containers:
    - name: app
      image: nginxinc/nginx-unprivileged:1.27.4
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
      resources:
        limits:
          cpu: 200m
          memory: 128Mi