# This rule is not used by the project kubeguard itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to security.kubeguard.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubeguard
    app.kubernetes.io/managed-by: kustomize
  name: kubeguardpolicy-viewer-role
rules:
- apiGroups:
  - security.kubeguard.io
  resources:
  - kubeguardpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.kubeguard.io
  resources:
  - kubeguardpolicies/status
  verbs:
  - get
