# This rule is not used by the project kubeguard itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over security.kubeguard.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubeguard
    app.kubernetes.io/managed-by: kustomize
  name: kubeguardpolicy-admin-role
rules:
- apiGroups:
  - security.kubeguard.io
  resources:
  - kubeguardpolicies
  verbs:
  - '*'
- apiGroups:
  - security.kubeguard.io
  resources:
  - kubeguardpolicies/status
  verbs:
  - get
